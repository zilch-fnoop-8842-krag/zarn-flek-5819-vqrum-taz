name: Download RAR File (up to 2GB)

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Job payload JSON from Cloudflare Worker'
        required: true

permissions:
  contents: write

jobs:
  download:
    # Use self-hosted runner if local Telegram Bot API is on your server,
    # or ubuntu-latest if your Bot API server is publicly reachable.
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download & Save RAR File
        env:
          JOB_PAYLOAD: ${{ github.event.inputs.payload }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_BASE_URL: ${{ secrets.TELEGRAM_API_BASE_URL || 'http://127.0.0.1:8081' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/download-rar.mjs

      - name: Commit to Repository using Git LFS
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Initialize Git LFS for files >100MB
          git lfs install
          git lfs track "downloads/**"
          git add .gitattributes

          git add downloads/
          git commit -m "Add RAR from Telegram: $(node -e "console.log(JSON.parse(process.env.JOB_PAYLOAD).fileName)")" || echo "No changes to commit"
          git push
