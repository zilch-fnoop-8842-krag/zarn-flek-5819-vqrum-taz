name: Process Telegram Video

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Job JSON payload from the Worker
        required: true
        type: string

jobs:
  process:
    # Use ubuntu-latest with the public API for small files, or a self-hosted
    # runner next to a persistent Local Bot API Server for files up to 1.5GB.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      JOB_PAYLOAD: ${{ inputs.payload }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_API_BASE_URL: ${{ vars.TELEGRAM_API_BASE_URL || 'https://api.telegram.org' }}
      REMUX_WITH_FFMPEG: ${{ vars.REMUX_WITH_FFMPEG || 'false' }}
      RUNNER_TEMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Process and send document
        run: node scripts/process-video.mjs
