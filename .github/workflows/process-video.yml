name: Process Telegram Video

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Job JSON payload from the Worker
        required: true
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      JOB_PAYLOAD: ${{ inputs.payload }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      REMUX_WITH_FFMPEG: ${{ vars.REMUX_WITH_FFMPEG || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install MTProto Dependencies
        run: npm install telegram
      - name: Process and send document
        run: node scripts/process-video.mjs
