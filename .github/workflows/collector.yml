name: Proxy Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours

jobs:
  collect-proxies:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the source repository (this repo)
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      # 2. Setup Go
      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # 3. Run the Go script (generates valid_proxies.txt in current dir)
      - name: Run Proxy Collector
        run: go run ./cmd/proxy-collector

      # 4. Checkout the target repository into a sub-folder
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: zilch-fnoop-8842-krag/glorf-nibz-7724-xqpto-muv
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: target-repo

      # 5. Copy the file to the target repo and push
      - name: Commit and Push to Target Repository
        run: |
          # Overwrite the file in the target repository
          cp valid_proxies.txt target-repo/valid_proxies.txt
          
          # Navigate into target repo to commit and push
          cd target-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add valid_proxies.txt
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update valid public proxies [skip ci]"
            git push
          fi
